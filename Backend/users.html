<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Usuários</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: white;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 35px;
    }

    .usuarios {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }

    .card {
      position: relative;
      padding: 25px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      transition: 0.3s;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--cor);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .topo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .avatar-container {
      position: relative;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--cor);
    }

    .status {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      right: 2px;
      bottom: 5px;
      border: 3px solid #17142f;
    }

    .online {
      background: #22c55e;
    }

    .offline {
      background: #64748b;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
    }

    .usuario {
      color: #94a3b8;
      margin-top: 4px;
    }

    .info {
      margin-top: 22px;
    }

    .info p {
      margin: 9px 0;
      color: #cbd5e1;
    }

    .nivel {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      border-radius: 20px;
      background: var(--cor);
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .botao {
      width: 100%;
      margin-top: 20px;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: var(--cor);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .botao:hover {
      filter: brightness(1.15);
      transform: scale(1.02);
    }
  </style>
</head>

<body>

    <b><a href="../index.html"><h1>Home &#10847;
</h1></a></b>

  <div class="container">

    <h1>✨ Nossos Usuários</h1>
    <p class="subtitle">Conheça nossa comunidade</p>

    <div class="usuarios" id="listaUsuarios"></div>

  </div>

  <script>

    const usuarios = [
      {
        id: 1,
        nome: "Ana Beatriz",
        usuario: "@anabeatriz",
        avatar: "https://i.pravatar.cc/150?img=47",
        cargo: "Designer",
        cidade: "Recife - PE",
        status: "online",
        nivel: "Premium",
        cor: "#8B5CF6"
      },
      {
        id: 2,
        nome: "Lucas Henrique",
        usuario: "@lucashenrique",
        avatar: "https://i.pravatar.cc/150?img=12",
        cargo: "Desenvolvedor",
        cidade: "São Paulo - SP",
        status: "online",
        nivel: "Gold",
        cor: "#F59E0B"
      },
      {
        id: 3,
        nome: "Mariana Costa",
        usuario: "@marianacosta",
        avatar: "https://i.pravatar.cc/150?img=32",
        cargo: "Fotógrafa",
        cidade: "Rio de Janeiro - RJ",
        status: "offline",
        nivel: "Silver",
        cor: "#64748B"
      },
      {
        id: 4,
        nome: "Gabriel Santos",
        usuario: "@gabrielsantos",
        avatar: "https://i.pravatar.cc/150?img=11",
        cargo: "Programador",
        cidade: "Recife - PE",
        status: "online",
        nivel: "Premium",
        cor: "#06B6D4"
      }
    ];

    const lista = document.getElementById("listaUsuarios");

    usuarios.forEach(usuario => {

      const card = document.createElement("div");

      card.className = "card";
      card.style.setProperty("--cor", usuario.cor);

      card.innerHTML = `
        <div class="topo">

          <div class="avatar-container">
            <img
              class="avatar"
              src="${usuario.avatar}"
              alt="Avatar de ${usuario.nome}"
            >

            <span class="status ${usuario.status}"></span>
          </div>

          <div>
            <div class="nome">${usuario.nome}</div>
            <div class="usuario">${usuario.usuario}</div>
          </div>

        </div>

        <div class="info">
          <p>💼 ${usuario.cargo}</p>
          <p>📍 ${usuario.cidade}</p>
          <span class="nivel">${usuario.nivel}</span>
        </div>

        <button
          class="botao"
          onclick="verPerfil(${usuario.id})"
        >
          Ver perfil
        </button>
      `;

      lista.appendChild(card);
    });

    function verPerfil(id) {
      const usuario = usuarios.find(u => u.id === id);

      alert(
        `👤 ${usuario.nome}\n\n` +
        `Usuário: ${usuario.usuario}\n` +
        `Cargo: ${usuario.cargo}\n` +
        `Cidade: ${usuario.cidade}\n` +
        `Plano: ${usuario.nivel}`
      );
    }

  </script>

</body>

</html>
